services:
  # PostgreSQL for development and tests. Data survives restarts in the "pgdata" volume.
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: stockledger
      POSTGRES_PASSWORD: stockledger
      POSTGRES_DB: stockledger
    ports:
      - "5433:5432" # 5433 on your machine, so it can run next to TaskFlow's database on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockledger"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
